<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Collecte Déchets - Mékhé</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link rel="stylesheet" href="style.css">
</head>

<body>

<h2>🗑️ Collecte Déchets - Mékhé</h2>

<!-- SWITCH MODE -->
<div>
  <button onclick="setMode('agent')">🧑‍🌾 Agent</button>
  <button onclick="setMode('dashboard')">📊 Dashboard</button>
</div>

<!-- ================= AGENT ================= -->
<div id="agentUI">

  <div class="form-box">
    <input type="text" id="agent_nom" placeholder="Nom agent">

    <select id="quartier">
      <option>HLM</option>
      <option>NDIOP</option>
      <option>LEBOU EST</option>
      <option>NGAYE</option>
    </select>

    <select id="equipe">
      <option>Équipe A</option>
      <option>Équipe B</option>
    </select>

    <button onclick="startTracking()">▶️ Démarrer</button>
    <button onclick="markPoint('depart')">📍 Départ</button>
    <button onclick="markPoint('decharge')">🚛 Décharge</button>
    <button onclick="stopTracking()">⏹️ Fin</button>
  </div>

  <div id="map"></div>

</div>

<!-- ================= DASHBOARD ================= -->
<div id="dashboardUI" style="display:none">

  <h3>📊 Statistiques</h3>

  <canvas id="chart"></canvas>

  <button onclick="loadDashboard()">🔄 Actualiser</button>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="app.js"></script>

</body>
</html>
